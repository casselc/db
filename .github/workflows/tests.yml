name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jolt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install joltc
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libpq5 libsqlite3-0
          url=$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest \
                | jq -r '.assets[] | select(.name | test("x86_64-linux\\.tar\\.gz$")) | .browser_download_url')
          mkdir -p "$HOME/.jolt"
          curl -fsSL "$url" | tar xz -C "$HOME/.jolt" --strip-components=1
          chmod +x "$HOME/.jolt/joltc"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_TEST_PG_URI=postgres://postgres:postgres@127.0.0.1:5432/jolt_test JOLT_PWD="$PWD" joltc -M:test
